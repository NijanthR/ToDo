services:
  - type: web
    name: taskflow-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
